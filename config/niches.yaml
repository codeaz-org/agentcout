dental_tourism:
  label: Dental & aesthetic clinics selling to UK/IE patients
  why_they_pay: One implant patient = EUR 3-8k. Their whole funnel is international patients researching
    online - increasingly via AI.
  discovery_queries:
  - dental implants clinic Romania for UK patients
  - dental clinic Cluj english speaking international patients
  - dental tourism Bucharest veneers UK patients
  - all on 4 dental implants Romania clinic price
  - cosmetic dentistry Timisoara international patients
  target_countries:
  - RO
  buyer_prompts:
  - I'm in the UK and need full mouth dental implants. Which clinics abroad should I consider?
  - Best dental tourism clinics in {country} for English-speaking patients?
  - Is {company} a good dental clinic? What do they charge for implants?
  - Compare {company} with other dental clinics for veneers abroad.
  - What are the risks of choosing {company} for dental work?
  email_angle: 'UK and Irish patients now ask ChatGPT which clinic to trust before they ever search Google.
    We tested how AI assistants answer for your region - and your clinic''s visibility in those answers
    is the finding we lead with.

    '
