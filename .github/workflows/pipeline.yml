name: AgentScout pipeline

on:
  schedule:
    # Twice a day, weekdays only (weekend cold email reads as spam).
    # 07:23 & 13:41 UTC = mid-morning / mid-afternoon in EU inboxes.
    - cron: "23 7 * * 1-5"
    - cron: "41 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: agentscout
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-llama3.2-3b-v1

      - name: Install & start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # ponytail: installer may or may not start systemd; race a manual serve, one wins
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          until curl -sf http://localhost:11434 >/dev/null; do sleep 1; done
          ollama pull llama3.2:3b

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"                                  # ponytail: see logs live, not post-mortem
          OLLAMA_HOST: "127.0.0.1:11434"                         # truthy → provider enabled in common.py
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}              # gh issues only (Models retired 2026-07-30)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # panel voice #2 (free tier)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}          # last-ditch fallback
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u src/run_all.py

      - name: Commit state back
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then echo "no changes"; exit 0; fi
          git config user.name  "agentscout-bot"
          git config user.email "agentscout-bot@users.noreply.github.com"
          git add data/
          git commit -m "run: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main || true
          git push
