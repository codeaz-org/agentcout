name: AgentScout pipeline

on:
  schedule:
    # Twice a day, weekdays only (weekend cold email reads as spam).
    # 07:23 & 13:41 UTC = mid-morning / mid-afternoon in EU inboxes.
    - cron: "23 7 * * 1-5"
    - cron: "41 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: agentscout
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # free LLM via GitHub Models + gh issues
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # optional fallback (free tier)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}          # optional fallback (free tier)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python src/run_all.py

      - name: Commit state back
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then echo "no changes"; exit 0; fi
          git config user.name  "agentscout-bot"
          git config user.email "agentscout-bot@users.noreply.github.com"
          git add data/
          git commit -m "run: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main || true
          git push
